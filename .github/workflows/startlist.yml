name: Startovní listina

# Denně stáhne přihlášené posádky z rbr.onlineracing.cz do public/data/startlist.json.
# Když se seznam změnil, commitne ho do main – Coolify pak web sám nasadí.
on:
  schedule:
    - cron: "17 5 * * *"   # každý den 05:17 UTC (6:17 / 7:17 v Česku)
  workflow_dispatch:        # ruční spuštění: záložka Actions → Startovní listina → Run workflow

permissions:
  contents: write

concurrency:
  group: startlist
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stáhnout startovní listinu
        run: python3 tools/fetch_startlist.py
      - name: Commit, pokud se něco změnilo
        run: |
          if [ -n "$(git status --porcelain public/data/startlist.json)" ]; then
            git config user.name "startlist-bot"
            git config user.email "startlist-bot@users.noreply.github.com"
            git add public/data/startlist.json
            git commit -m "Startovní listina: aktualizace $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Beze změny."
          fi
