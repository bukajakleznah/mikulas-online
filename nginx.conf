gzip on;
gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;
gzip_min_length 512;

server {
  listen 80 default_server;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;

  location ~* \.(jpg|svg|webp|png|ico)$ { expires 30d; add_header Cache-Control "public, max-age=2592000"; }
  location ~* \.(css|js)$ { add_header Cache-Control "no-cache"; }
  location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
